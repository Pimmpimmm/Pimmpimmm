<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Pim AI Student</title>
  <desc id="desc">A dark futuristic neural network banner in cyan, violet, and pink.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#0d1028"/>
      <stop offset="1" stop-color="#11051f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff4081"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6d79a8" stroke-opacity=".11"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="160" cy="68" r="150" fill="url(#glow)" opacity=".36" filter="url(#blur)"/>
  <circle cx="1070" cy="255" r="180" fill="#7c4dff" opacity=".11" filter="url(#blur)"/>

  <g fill="none" stroke="url(#neon)" stroke-opacity=".55" stroke-width="1.6">
    <path d="M44 205L122 157L199 189L278 100L354 138"/>
    <path d="M846 92L918 148L985 95L1061 144L1154 83"/>
    <path d="M845 221L918 148L1007 217L1061 144L1162 213"/>
  </g>
  <g fill="#00e5ff">
    <circle cx="44" cy="205" r="4"/><circle cx="122" cy="157" r="6"/><circle cx="199" cy="189" r="4"/><circle cx="278" cy="100" r="6"/><circle cx="354" cy="138" r="4"/>
    <circle cx="846" cy="92" r="4"/><circle cx="918" cy="148" r="6"/><circle cx="985" cy="95" r="4"/><circle cx="1061" cy="144" r="7"/><circle cx="1154" cy="83" r="4"/>
  </g>
  <g fill="#ff4081">
    <circle cx="845" cy="221" r="4"/><circle cx="1007" cy="217" r="5"/><circle cx="1162" cy="213" r="4"/>
  </g>

  <text x="600" y="132" text-anchor="middle" fill="#f4f7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="52" font-weight="700" letter-spacing="9">PIM</text>
  <rect x="425" y="159" width="350" height="2" rx="1" fill="url(#neon)"/>
  <text x="600" y="198" text-anchor="middle" fill="#aab4d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="6">AI STUDENT · EXPLORER</text>
  <circle cx="600" cy="160" r="7" fill="#00e5ff" filter="url(#soft)"/>
  <circle cx="600" cy="160" r="3" fill="#ffffff"/>

  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="url(#neon)" stroke-opacity=".35" stroke-width="2"/>
</svg>
